[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adb-interaction-mcp"
version = "0.1.0"
description = "MCP server for interacting with Android emulators/devices via ADB"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0",
]

[project.scripts]
adb-mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
